[supervisord]
nodaemon=true
pidfile=/tmp/archive-tracking-supervisord.pid
logfile=/tmp/archive-tracking-logs/supervisord.log

[unix_http_server]
file=/tmp/archive-tracking-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/archive-tracking-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mlflow]
command=mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////tmp/archive-mlflow/metadata.db --serve-artifacts --artifacts-destination /archive/tracking/mlflow/artifacts --static-prefix /solutions/mlflow
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/tmp/archive-tracking-logs/mlflow.log
stderr_logfile=/tmp/archive-tracking-logs/mlflow.error.log

[program:tensorboard]
command=tensorboard --logdir /archive --host 0.0.0.0 --port 6006 --path_prefix /solutions/tensorboard --reload_interval 10 --load_fast=false
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/tmp/archive-tracking-logs/tensorboard.log
stderr_logfile=/tmp/archive-tracking-logs/tensorboard.error.log
