[supervisord]
nodaemon=true
pidfile=/tmp/miagent-tracking-supervisord.pid
logfile=/runtime/logs/tracking-supervisord.log

[unix_http_server]
file=/tmp/miagent-tracking-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/miagent-tracking-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mlflow]
command=mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////runtime/mlflow/metadata.db --serve-artifacts --artifacts-destination /runtime/mlflow/artifacts
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/mlflow.log
stderr_logfile=/runtime/logs/mlflow.error.log

[program:tensorboard]
command=tensorboard --logdir /workspace/challenge --host 0.0.0.0 --port 6006 --path_prefix /tensorboard --reload_interval 10 --load_fast=false
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/tensorboard.log
stderr_logfile=/runtime/logs/tensorboard.error.log
