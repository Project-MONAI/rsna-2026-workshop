[supervisord]
nodaemon=true
pidfile=/tmp/miagent-dashboard-supervisord.pid
logfile=/runtime/logs/dashboard-supervisord.log

[unix_http_server]
file=/tmp/miagent-dashboard-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/miagent-dashboard-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mlflow]
command=mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////runtime/mlflow/metadata.db --serve-artifacts --artifacts-destination /runtime/mlflow/artifacts
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/mlflow.log
stderr_logfile=/runtime/logs/mlflow.error.log

[program:tensorboard]
# The optional Rust/gRPC fast loader can become detached in a long-running
# container, leaving the HTML shell available while every data request fails.
# The standard loader is reliable for these local experiment logs.
command=tensorboard --logdir /workspace/challenge --host 0.0.0.0 --port 6006 --reload_interval 10 --load_fast=false
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/tensorboard.log
stderr_logfile=/runtime/logs/tensorboard.error.log

[program:reports]
command=python3 tools/webui/app.py --challenge /workspace/challenge --host 0.0.0.0 --port 8765
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/reports.log
stderr_logfile=/runtime/logs/reports.error.log
