[supervisord]
nodaemon=true
pidfile=/tmp/miagent-supervisord.pid
logfile=/runtime/logs/miagent-supervisord.log

[unix_http_server]
file=/tmp/miagent-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/miagent-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8080 --auth none --extensions-dir /usr/local/share/code-server/extensions %(ENV_MIAgent_HOST_ROOT)s
directory=%(ENV_MIAgent_HOST_ROOT)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/code-server.log
stderr_logfile=/runtime/logs/code-server.error.log

[program:opencode]
command=opencode web --hostname 0.0.0.0 --port 4096
directory=%(ENV_MIAgent_HOST_ROOT)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/opencode.log
stderr_logfile=/runtime/logs/opencode.error.log

[program:reports]
command=python3 tools/webui/app.py --challenge %(ENV_MIAgent_HOST_ROOT)s/challenge --host 0.0.0.0 --port 8765
directory=%(ENV_MIAgent_HOST_ROOT)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/reports.log
stderr_logfile=/runtime/logs/reports.error.log

[program:viewer]
command=python3 tools/webui/app.py --challenge %(ENV_MIAgent_HOST_ROOT)s/challenge --inference-root %(ENV_MIAgent_HOST_ROOT)s/inference_tmp --start-at-root --data-root /data --host 0.0.0.0 --port 8770
directory=%(ENV_MIAgent_HOST_ROOT)s
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/runtime/logs/viewer.log
stderr_logfile=/runtime/logs/viewer.error.log
