schema_version: 1
architecture: segresnet2d
seed: 20260915
model:
  init_filters: 32
  dropout: 0.1
input:
  context_slices: 7
  windows: [broad, cardiac_soft_tissue, context]
  coordinates: false
training:
  epochs: 10
  validation_epochs: [5, 10]
  samples_per_epoch: 2560
  batch_size: 8
  validation_batch_size: 24
  workers: 4
  precision: bf16
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weighting: sqrt_inverse_frequency
  dice_weight: 1.0
  cross_entropy_weight: 0.5
augmentation:
  affine_probability: 0.7
  flip_probability: 0.5
inference:
  largest_component_per_class: true
